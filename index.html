<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThirsTEA — bubble tea in Cooksville, Mississauga</title>
    <meta
      name="description"
      content="Milk teas, fruity slushes, creamy smoothies, matcha and warm bubble waffles. Unit 3, 26 Dundas Street East, Mississauga. One shop, open late."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23FFF8EE'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23111111'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Refreshing has to land at the top of the page.

      Browsers restore the previous scroll position on reload, which drops a
      returning visitor halfway down a page whose hero they never see again.
      Inline and before the app bundle on purpose: the browser decides whether
      to restore scroll very early, and a module script is too late to stop it.

      Anchors are left alone — the skip link relies on #main still working.
    -->
    <script>
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual'
      }
      if (!window.location.hash) {
        window.scrollTo(0, 0)
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
